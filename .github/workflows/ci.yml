name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # lockfile is generated on Windows; ensure Linux native bindings for Tailwind/lightningcss
      - run: npm rebuild lightningcss --workspace=openblog-template

      - run: npm run test

      - run: npm run test:scaffold

      - run: npm run lint

      - run: npm run validate:posts

      - run: npm run build
